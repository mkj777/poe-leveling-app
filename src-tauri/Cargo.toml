[package]
name = "poe-leveling-guide"
version = "0.0.0"
description = "PoE Leveling Guide"
authors = ["you"]
license = ""
repository = "https://github.com/mkj777/poe-leveling-app"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tauri = { version = "1.5", features = [ "window-create", "window-set-resizable", "window-set-focus", "window-maximize", "window-show", "protocol-asset", "path-all", "fs-read-dir", "window-set-skip-taskbar", "app-all", "dialog-open", "updater", "window-hide", "system-tray", "window-start-dragging", "window-close", "window-set-size", "window-set-always-on-top", "window-minimize", "window-set-position", "window-set-ignore-cursor-events", "global-shortcut-all", "clipboard-read-text", "fs-read-file", "fs-exists", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
async-fs = "2.1.0"
serde_json = "1.0"
# winapi 0.3 ist feature-gated. Die Module hier explizit nennen, statt sich
# darauf zu verlassen, dass eine andere Kiste sie zufaellig einschaltet.
winapi = { version = "0.3.9", features = [
    "handleapi",
    "minwindef",
    "ntdef",
    "processthreadsapi",
    "winbase",
    "windef",
    "winnt",
    "winuser",
] }
# default-features = false haelt openssl draussen, siehe ADR-0003.
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
# strip = true  # Automatically strip symbols from the binary.