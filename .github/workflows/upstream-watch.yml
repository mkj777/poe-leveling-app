name: Watch upstream parser

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: HeartofPhos/exile-leveling
          path: upstream

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Re-vendor the parser
        run: node scripts/vendor-exile-leveling.mjs upstream

      - name: Pull request on changes
        uses: peter-evans/create-pull-request@v6
        with:
          # Only what the script writes. Without this the action would pick up
          # the upstream checkout under `upstream/` as a submodule.
          add-paths: src/lib/exile-leveling
          branch: upstream/parser-drift
          title: 'chore: update the vendored exile-leveling route parser'
          commit-message: 'chore: update the vendored exile-leveling route parser'
          body: |
            The upstream parser has changed. The vendored copy under
            `src/lib/exile-leveling/` was regenerated.

            Check before merging:

            - `yarn test` passes, in particular the golden-file test.
            - If the golden-file test fails, decide whether it is data drift
              or parser drift:
              - Data drift, the normal case: regenerate the fixture with
                `yarn fixture:route` and refresh the snapshot under
                `src/lib/exile-leveling/__fixtures__/` along with it.
              - Parser drift: the vendored code no longer fits our loader in
                `data.ts`, a real fix is needed.
            - `yarn tsc --noEmit` passes. If it fails on unused variables,
              upstream style has met our strict options, see ATTRIBUTION.md.
