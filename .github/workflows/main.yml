name: Release veroeffentlichen

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Frontend-Abhaengigkeiten
        run: yarn install --frozen-lockfile

      - name: Tests
        run: yarn test

      # vpk ist ein dotnet-Werkzeug. Auf windows-latest liegt das SDK bereit.
      - name: Velopack-CLI
        run: dotnet tool install -g vpk

      # Der Tag ist die Quelle der Wahrheit fuer die Version. Weicht
      # tauri.conf.json davon ab, bricht der Lauf hier ab, statt ein Release
      # mit falscher Nummer zu erzeugen.
      - name: Version aus dem Tag pruefen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$conf" ]; then
            echo "Tag $tag passt nicht zu tauri.conf.json $conf" >&2
            exit 1
          fi

      # Frueh, nicht erst nach zehn Minuten Bauzeit: ein Release ohne
      # Changelog-Eintrag soll in Sekunden auffallen.
      - name: Changelog-Eintrag pruefen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Bauen, packen und hochladen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-velopack.mjs --upload

      # `vpk upload` legt das Release an, kann aber keine Beschreibung setzen.
      # Ohne diesen Schritt blieben die Releases leer, wie 0.91.0 bis 0.95.0.
      - name: Release-Beschreibung aus dem Changelog setzen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
