name: Publish release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Tests
        run: yarn test

      # vpk is a dotnet tool. The SDK is available on windows-latest.
      - name: Velopack CLI
        run: dotnet tool install -g vpk

      # The tag is the source of truth for the version. If tauri.conf.json
      # differs, the run aborts here instead of producing a release with the
      # wrong number.
      - name: Check version against the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$conf" ]; then
            echo "Tag $tag does not match tauri.conf.json $conf" >&2
            exit 1
          fi

      # Early, not after ten minutes of build time: a release without a
      # changelog entry should show up within seconds.
      - name: Check changelog entry
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Build, pack and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-velopack.mjs --upload

      # `vpk upload` creates the release but cannot set a description.
      # Without this step the releases stayed empty, like 0.91.0 to 0.95.0.
      - name: Set release description from the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
